<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha News, Weather, Sports, Breaking News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif !important;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#ededed]">
    <div id="header"></div>
    <div id="pub"></div>
    <main class="px-44 pb-12">
        <div class="flex justify-center w-full mt-4 gap-4">
            <div class="w-[70%] bg-white h-full pb-8">
                <div id="content"></div>
                <div id="more"></div>
            </div>
            <div class="w-[30%] sticky top-4 selft-start max-h-[calc(100vh-100px)]" id="trending"></div>
        </div>
    </main>

    <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
      });
    fetch('trending.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('trending').innerHTML = html;
      });
    fetch('mainContent/heroArticle.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('content').innerHTML = html;
      });
    fetch('mainContent/articleCard.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('more').innerHTML = html;
      });
    fetch('adbanner/adbanner.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('pub').innerHTML = html;
      });
  </script>

</body>
</html>
