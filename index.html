<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha News, Weather, Sports, Breaking News</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#ededed]">
    <div id="header"></div>
    <main class="px-36 ">
        <div class="adBeforeArticle bg-red-200">
            <img class="adContent">
        </div>
        <div class="flex justify-center w-full mt-4 gap-4">
            <div class="w-3/4 bg-red-100 h-full">
                <div class="articleContent">
                    <div class="artcileTitle">
                        <h1>Household Robot NEO Under Fire After Accident Involving 6-Year-Old in Omaha</h1>
                    </div>
                    <div class="sous-titre">

                    </div>
                </div>

            </div>
            <div class="w-1/4" id="trending"></div>
        </div>
    </main>

    <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
      });
    fetch('trending.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('trending').innerHTML = html;
      });
  </script>

</body>
</html>
