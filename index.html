<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha News, Weather, Sports, Breaking News</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#ededed]">
    <div id="header"></div>
    <main class="px-36 ">
        <div class="adBeforeArticle bg-red-200">
            <img class="adContent">
        </div>
        <div class="flex justify-center w-full mt-4 gap-4">
            <div class="w-3/4 bg-white h-full">
                <div id="content"></div>
            </div>
            <div class="w-1/4" id="trending"></div>
        </div>
    </main>

    <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
      });
    fetch('trending.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('trending').innerHTML = html;
      });
    fetch('mainContent/heroArticle.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('content').innerHTML = html;
      });
  </script>

</body>
</html>
