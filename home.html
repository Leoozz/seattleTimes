<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omaha New, Weather, Sports, Breaking News</title>
    <link rel="icon" type="image/x-icon" href="./ressources/images/kptm-favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif !important;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body class="bg-[#ededed]">
    <div id="header"></div>
    <div id="pub"></div>
    <main class="">
        <div class="flex justify-center mt-4 gap-4 mx-auto max-w-[1185px]">
            <div class="w-[70%] sticky top-4 selft-start max-h-[calc(100vh-100px)]">
                <div id="content"></div>
                <div id="offbeatnews"></div>
            </div>
            <div class="w-[30%]">
                <div class="mb-4" id="adsidebar"></div>
                <div class="mb-4" id="social"></div>
                <div class="mb-4" id="sidebar"></div>

            </div>
        </div>
    </main>
    <div id="pubmiddle"></div>
    <div id="news" class="mx-auto max-w-[1185px]"></div>
    <div id="footer"></div>




    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('header').innerHTML = html;
            });
        fetch('adbanner/adbanner.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('pub').innerHTML = html;
            });
        fetch('home/sidebar/adsidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('adsidebar').innerHTML = html;
            });
        fetch('home/sidebar/socialsidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('social').innerHTML = html;
            });
        fetch('home/sidebar/sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebar').innerHTML = html;
            });
        fetch('home/content.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('content').innerHTML = html;
            });
        fetch('home/offbeatnews.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('offbeatnews').innerHTML = html;
            });
        fetch('adbanner/adbanner.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('pubmiddle').innerHTML = html;
            });
        fetch('home/othernews.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('news').innerHTML = html;
            });  
        fetch('footer.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('footer').innerHTML = html;
            });
    </script>

</body>

</html>
